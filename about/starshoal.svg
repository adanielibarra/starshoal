<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1b4b72"/>
      <stop offset="1" stop-color="#081f33"/>
    </radialGradient>
    <clipPath id="c"><circle cx="80" cy="80" r="76"/></clipPath>
  </defs>
  <circle cx="80" cy="80" r="78" fill="#ffd166"/>
  <circle cx="80" cy="80" r="76" fill="url(#sky)"/>
  <g clip-path="url(#c)">
    <!-- planet with ring -->
    <circle cx="122" cy="40" r="11" fill="#e76f51"/>
    <ellipse cx="122" cy="40" rx="20" ry="5" fill="none" stroke="#ffd166" stroke-width="2" transform="rotate(-20 122 40)"/>
    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="30" cy="42" r="1.4"/><circle cx="52" cy="24" r="1"/><circle cx="92" cy="18" r="1.2"/>
      <circle cx="140" cy="70" r="1"/><circle cx="24" cy="70" r="1"/><circle cx="66" cy="44" r="0.9"/>
      <circle cx="102" cy="52" r="0.9"/><circle cx="44" cy="58" r="0.8"/>
    </g>
    <path d="M38 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffd166"/>
    <path d="M100 30 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4z" fill="#ffd166"/>
    <!-- boat -->
    <path d="M79 36 L79 84 L52 84 Z" fill="#ffffff"/>
    <path d="M83 44 L83 84 L104 84 Z" fill="#8ecae6"/>
    <rect x="79.5" y="32" width="3" height="54" fill="#f1faee"/>
    <path d="M82 32 l9 3 -9 3z" fill="#e76f51"/>
    <path d="M44 88 L116 88 L106 100 L54 100 Z" fill="#ffd166"/>
    <!-- starry wave the boat sails on -->
    <path d="M0 100 C20 94 30 106 50 100 S80 94 100 100 S130 106 160 98 L160 160 L0 160Z" fill="#1d7ea8"/>
    <!-- sounding line with lead -->
    <line x1="92" y1="100" x2="92" y2="128" stroke="#f1faee" stroke-width="1.6" stroke-dasharray="3 3"/>
    <path d="M89 128 h6 l-1 6 h-4z" fill="#f1faee"/>
    <!-- bathymetric contours -->
    <path d="M0 118 C30 112 50 124 80 118 S130 112 160 120" fill="none" stroke="#8ecae6" stroke-width="1.4" opacity=".7"/>
    <path d="M0 132 C30 126 55 138 85 132 S135 128 160 134" fill="none" stroke="#8ecae6" stroke-width="1.4" opacity=".55"/>
    <path d="M0 146 C35 140 60 150 90 145 S135 142 160 148" fill="none" stroke="#8ecae6" stroke-width="1.4" opacity=".4"/>
    <!-- seafloor -->
    <path d="M0 150 C30 140 50 156 80 148 S130 142 160 150 L160 160 L0 160Z" fill="#e9c46a"/>
  </g>
</svg>
